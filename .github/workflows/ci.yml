name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: spinneret
          POSTGRES_PASSWORD: spinneret
          POSTGRES_DB: spinneret
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U spinneret" --health-interval 5s --health-timeout 3s --health-retries 30
      valkey:
        image: valkey/valkey:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 5s --health-timeout 3s --health-retries 30
      clickhouse:
        image: clickhouse/clickhouse-server:25.8-alpine
        env:
          CLICKHOUSE_USER: spinneret
          CLICKHOUSE_PASSWORD: spinneret
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports: ["9000:9000"]
    env:
      SPINNERET_TEST_DATABASE_URL: postgres://spinneret:spinneret@localhost:5432/spinneret?sslmode=disable
      SPINNERET_TEST_REDIS_URL: redis://localhost:6379/0
      SPINNERET_TEST_CLICKHOUSE_URL: clickhouse://spinneret:spinneret@localhost:9000/default
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify generated code is up to date
        run: |
          go install github.com/bufbuild/buf/cmd/buf@v1.73.0
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install connectrpc.com/connect/cmd/protoc-gen-connect-go@latest
          export PATH="$(go env GOPATH)/bin:$PATH"
          buf lint && buf generate
          for f in $(find . -name sqlc.yaml -not -path './web/*'); do sqlc generate -f "$f"; done
          git diff --exit-code -- gen internal
      - name: Vet
        run: go vet ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2
          args: --build-tags e2e --timeout 10m
      - name: Test
        run: go test -race -count=1 -skip 'TestStart.*Container' ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      # package_json_file is resolved from the repository root, not from
      # defaults.run.working-directory, which only applies to `run:` steps. Without
      # it the action looks for a package.json that this repository does not have at
      # the root and fails with "No pnpm version is specified".
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build

  python-sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[dev]'
      - run: pytest -q
      - run: ruff check . && ruff format --check .
      - if: matrix.python == '3.12'
        run: mypy src

  image:
    runs-on: ubuntu-latest
    needs: [go, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: false
          tags: spinneret:ci
