name: Bug report
description: Something does not work the way the documentation says it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not use this form for security problems —
        report those privately at
        https://github.com/TikHub/Spinneret/security/advisories/new
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `spnr version`, or the image tag / commit you are running.
      placeholder: v0.1.0
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: How is it deployed?
      options:
        - Docker Compose (deploy/compose)
        - Docker Compose via install/install.sh
        - Kubernetes or another orchestrator
        - From source, no containers
        - Other
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      description: If the documentation says otherwise, link the page.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
      description: Include the exact error, the Spinneret-Reason header if there was one, and the relevant log lines.
      render: text
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The smallest sequence that shows the problem. A failing test is the best possible answer here.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Host OS and architecture, Docker version, replica count, and roughly how many identities, sites and requests per second.
    validations:
      required: false
