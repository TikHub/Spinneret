# Dependabot keeps the four ecosystems this repository actually builds from up to date.
# Alerts alone only tell you about a vulnerability; these entries are what open the pull request.
#
# Updates are grouped so that a week of patch bumps arrives as one reviewable PR per ecosystem
# rather than a dozen. Major versions are deliberately left ungrouped: they need a human.
version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: scope
    ignore:
      # The main branches of otelconnect and validate already target connect-go v2
      # (connectrpc.com/connect/v2; connectrpc/otelconnect-go#216, connectrpc/validate-go#55) and
      # have removed the NewInterceptor constructors that internal/server/http.go calls. Both cut
      # every release from main, patch releases included (otelconnect's v0.7.1 and v0.7.2), so
      # anything newer than the versions in go.mod would land in the weekly group below and break
      # it. Take them together with a deliberate connect-go v2 migration instead.
      # The ranges hold back security updates too: an advisory fixed only inside them gets no PR,
      # and its alert stays open until that migration.
      - dependency-name: connectrpc.com/otelconnect
        versions: ["> 0.10.0"]
      - dependency-name: connectrpc.com/validate
        versions: ["> 0.7.0"]
    groups:
      go-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: scope
    groups:
      # The console's toolchain moves as a set; splitting it produces PRs that
      # cannot pass CI on their own.
      console-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /sdk/python
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
      include: scope
    groups:
      python-sdk-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
      include: scope
    groups:
      actions-all:
        patterns: ["*"]
