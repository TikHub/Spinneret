# Dependabot keeps the four ecosystems this repository actually builds from up to date.
# Alerts alone only tell you about a vulnerability; these entries are what open the pull request.
#
# Updates are grouped so that a week of patch bumps arrives as one reviewable PR per ecosystem
# rather than a dozen. Major versions are deliberately left ungrouped: they need a human.
version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: scope
    ignore:
      # otelconnect's main branch already targets connect-go v2 (connectrpc.com/connect/v2,
      # connectrpc/otelconnect-go#216) and has removed the NewInterceptor that
      # internal/server/http.go calls. Being 0.x, its next release counts as a minor update, so
      # it would land in the weekly group below and break it. Take it together with a
      # deliberate connect-go v2 migration instead.
      - dependency-name: connectrpc.com/otelconnect
        versions: [">= 0.11.0"]
    groups:
      go-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: scope
    groups:
      # The console's toolchain moves as a set; splitting it produces PRs that
      # cannot pass CI on their own.
      console-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /sdk/python
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
      include: scope
    groups:
      python-sdk-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
      include: scope
    groups:
      actions-all:
        patterns: ["*"]
