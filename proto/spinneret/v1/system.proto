syntax = "proto3";

package spinneret.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/TikHub/Spinneret/gen/go/spinneret/v1;spinneretv1";

// SystemService exposes facts about the deployment itself rather than about the
// data inside it. Every call requires a console session.
service SystemService {
  // CheckForUpdate compares the running build against the latest published
  // release.
  //
  // The call is what makes the deployment reach out: nothing here runs on a
  // timer, and an operator who wants no outbound call at all sets
  // SPINNERET_UPDATE_CHECK_URL to the empty string, after which this returns
  // `disabled`. The request carries nothing about the deployment. Answers are
  // cached for an hour because the default feed is rate limited per source
  // address.
  rpc CheckForUpdate(CheckForUpdateRequest) returns (CheckForUpdateResponse);

  // ListSettings returns the deployment settings an operator may change while
  // the server runs, each with where its effective value came from. Any console
  // session may read them; what a deployment keeps its data for is not secret,
  // and an operator investigating a full disk should not need a role binding to
  // see it.
  rpc ListSettings(ListSettingsRequest) returns (ListSettingsResponse);

  // UpdateSettings changes deployment settings. Platform administrators only:
  // these are properties of the whole deployment rather than of one tenant, and
  // shortening a retention deletes data on the next hourly pass.
  //
  // Only the keys present in the request are touched, and an empty value returns
  // that setting to its default. The whole request is validated before anything
  // is written, so one rejected value leaves the others unchanged.
  rpc UpdateSettings(UpdateSettingsRequest) returns (UpdateSettingsResponse);
}

// Where a setting's effective value came from.
enum SettingOrigin {
  SETTING_ORIGIN_UNSPECIFIED = 0;
  // Nothing has set it; the value is the built-in default.
  SETTING_ORIGIN_DEFAULT = 1;
  // An operator set it from the console.
  SETTING_ORIGIN_DATABASE = 2;
  // An environment variable set it, which also pins it: the console shows the
  // value and refuses to change it, so that a deployment managed from a file
  // keeps the guarantee that the file is what runs.
  SETTING_ORIGIN_ENVIRONMENT = 3;
}

// One deployment setting.
message Setting {
  // Stable identifier, e.g. "retention.risk_events".
  string key = 1;
  // Effective value as text: a duration such as "30d", or a whole number for a
  // setting counted in days.
  string value = 2;
  // The built-in default, so the console can offer to reset to it.
  string default_value = 3;
  SettingOrigin origin = 4;
  // The variable that would pin this setting, whatever the origin is, so an
  // operator can be told which one to remove.
  string env_var = 5;
  // "duration" or "days".
  string unit = 6;
  // Inclusive bounds, in the same spelling as value.
  string minimum = 7;
  string maximum = 8;
}

// ListSettingsRequest is empty.
message ListSettingsRequest {}

message ListSettingsResponse {
  repeated Setting settings = 1;
  // Whether the caller may change the settings that are not pinned.
  bool can_edit = 2;
}

message UpdateSettingsRequest {
  // Only the keys present are changed. An empty value resets that setting.
  map<string, string> values = 1;
}

message UpdateSettingsResponse {
  repeated Setting settings = 1;
}

// CheckForUpdateRequest is empty.
message CheckForUpdateRequest {}

// CheckForUpdateResponse describes the running build and, when the check is
// enabled and reached the feed, the latest published release.
message CheckForUpdateResponse {
  // Build this server runs, as `spnr version` reports it: a release tag such as
  // "v0.1.0", or "dev-<revision>" for a build from source.
  string current_version = 1;
  // Newest published release. Empty when the check is disabled, when the feed
  // could not be reached, or when the newest entry is a draft or pre-release.
  string latest_version = 2;
  // Release notes of latest_version.
  string release_url = 3;
  // True only when latest_version is a strictly newer release than a
  // current_version that names a release. A build with no release number is
  // never told it is out of date.
  bool update_available = 4;
  // When the feed was last read. Unset when it never was.
  google.protobuf.Timestamp checked_at = 5;
  // True when the operator turned the check off; no outbound call was made.
  bool disabled = 6;
  // Why the check could not be completed, empty on success. It is a message for
  // an operator, not a machine-readable reason: the call itself succeeds so
  // that the console can still show the running build.
  string error = 7;
  // True when current_version names a published release rather than a build
  // from source. When it is false, update_available is false because the two
  // versions cannot be ordered, which is not the same thing as being up to
  // date: a build from source may be ahead of the latest release, behind it, or
  // unrelated to it. Present the two cases differently.
  bool current_is_release = 8;
}
