syntax = "proto3";

package spinneret.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/Evil0ctal/Spinneret/gen/go/spinneret/v1;spinneretv1";

// SecretService lets nodes read vault secrets of their token namespace. It
// requires a `secret:read:<glob over "<namespace>/<path>">` token scope and
// every read is written to the audit log.
service SecretService {
  // GetSecret returns the plaintext of a secret version.
  rpc GetSecret(GetSecretRequest) returns (GetSecretResponse);
}

// GetSecretRequest addresses a secret version.
message GetSecretRequest {
  // Secret path relative to the token namespace, e.g. "signing/api_key".
  string path = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
    pattern: "^[a-z0-9][a-z0-9_./-]*$"
  }];
  // Version to read; 0 reads the current version.
  int32 version = 2 [(buf.validate.field).int32.gte = 0];
}

// GetSecretResponse carries the secret value.
message GetSecretResponse {
  // Secret path relative to the namespace.
  string path = 1;
  // Version that was read.
  int32 version = 2;
  // Plaintext value.
  string value = 3;
  // Expiry of the secret; null when it does not expire.
  google.protobuf.Timestamp expires_at = 4;
}
