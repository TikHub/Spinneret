syntax = "proto3";

package spinneret.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/TikHub/Spinneret/gen/go/spinneret/v1;spinneretv1";

// SecretAdminService manages vault secrets and key-encryption-key (KEK)
// rotation. Secret values are write-only except through RevealSecret.
service SecretAdminService {
  // ListSecrets lists secret metadata of a namespace (secret:list).
  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse);
  // GetSecret returns the metadata of one secret (secret:list). The request and
  // response carry the service name because SecretService owns GetSecretRequest.
  rpc GetSecret(SecretAdminServiceGetSecretRequest) returns (SecretAdminServiceGetSecretResponse);
  // CreateSecret creates a secret with its first version (secret:write).
  rpc CreateSecret(CreateSecretRequest) returns (CreateSecretResponse);
  // UpdateSecret updates metadata and optionally stores a new version (secret:write).
  rpc UpdateSecret(UpdateSecretRequest) returns (UpdateSecretResponse);
  // DeleteSecret deletes a secret and all of its versions (secret:write).
  rpc DeleteSecret(DeleteSecretRequest) returns (DeleteSecretResponse);
  // RevealSecret returns the plaintext of a secret version (secret:reveal, audited).
  rpc RevealSecret(RevealSecretRequest) returns (RevealSecretResponse);
  // ListSecretVersions lists version metadata, newest first (secret:list).
  rpc ListSecretVersions(ListSecretVersionsRequest) returns (ListSecretVersionsResponse);
  // ListSecretAccessLogs lists audited reads and changes of a secret, newest first (secret:list, audit:read).
  rpc ListSecretAccessLogs(ListSecretAccessLogsRequest) returns (ListSecretAccessLogsResponse);
  // GetKEKStatus reports configured KEKs and rewrap progress (kek:manage, platform admin).
  rpc GetKEKStatus(GetKEKStatusRequest) returns (GetKEKStatusResponse);
  // StartKEKRewrap starts re-wrapping every DEK onto the current KEK (kek:manage, platform admin).
  rpc StartKEKRewrap(StartKEKRewrapRequest) returns (StartKEKRewrapResponse);
}

// SecretInfo is the metadata of a secret. It never carries the value.
message SecretInfo {
  // Secret ID ("sec_...").
  string id = 1;
  // Namespace name.
  string namespace = 2;
  // Path relative to the namespace, e.g. "signing/api_key".
  string path = 3;
  // Human-readable description.
  string description = 4;
  // Free-form tags.
  repeated string tags = 5;
  // Current version number.
  int32 current_version = 6;
  // Masked value of the current version, e.g. "••••abcd".
  string masked_value = 7;
  // Expiry time; unset when the secret does not expire.
  google.protobuf.Timestamp expires_at = 8;
  // Time of the last read by a node or reveal.
  google.protobuf.Timestamp last_accessed_at = 9;
  // Actor ("user:<id>" or "token:<id>") that created the secret.
  string created_by = 10;
  // Creation time.
  google.protobuf.Timestamp created_at = 11;
  // Last update time.
  google.protobuf.Timestamp updated_at = 12;
}

// SecretVersion is the metadata of one immutable secret version.
message SecretVersion {
  // Version number, starting at 1.
  int32 version = 1;
  // Actor that stored the version.
  string created_by = 2;
  // Creation time.
  google.protobuf.Timestamp created_at = 3;
  // ID of the KEK that wraps the version's data key.
  string kek_id = 4;
}

// SecretAccessLog is one audited access to a secret.
message SecretAccessLog {
  // Time of the access.
  google.protobuf.Timestamp created_at = 1;
  // Actor kind: user | token | system.
  string actor_kind = 2;
  // Actor ID.
  string actor_id = 3;
  // Actor display name.
  string actor_name = 4;
  // Audited action, e.g. "secret.read", "secret.reveal", "secret.update".
  string action = 5;
  // Result: ok | denied | error.
  string result = 6;
  // Client IP address.
  string ip = 7;
  // Version accessed; 0 when not applicable.
  int32 version = 8;
}

// ListSecretsRequest selects a page of secrets.
message ListSecretsRequest {
  // Namespace name.
  string namespace = 1 [(buf.validate.field).string = {min_len: 1, max_len: 64}];
  // Substring match on the path or description.
  string search = 2 [(buf.validate.field).string.max_len = 256];
  // Tags that must all be present.
  repeated string tags = 3 [(buf.validate.field).repeated = {max_items: 32, items: {string: {min_len: 1, max_len: 64}}}];
  // Page size, 0 = default (50).
  int32 page_size = 4 [(buf.validate.field).int32 = {gte: 0, lte: 500}];
  // Opaque cursor from a previous response.
  string page_token = 5 [(buf.validate.field).string.max_len = 1024];
}

// ListSecretsResponse is a page of secrets ordered by path.
message ListSecretsResponse {
  // Secrets of this page.
  repeated SecretInfo secrets = 1;
  // Cursor of the next page; empty when this is the last page.
  string next_page_token = 2;
  // Total number of matching secrets.
  int32 total = 3;
}

// SecretAdminServiceGetSecretRequest identifies a secret.
message SecretAdminServiceGetSecretRequest {
  // Secret ID.
  string id = 1 [(buf.validate.field).string = {min_len: 1, max_len: 64}];
}

// SecretAdminServiceGetSecretResponse carries the secret metadata.
message SecretAdminServiceGetSecretResponse {
  // The secret.
  SecretInfo secret = 1;
}

// CreateSecretRequest creates a secret.
message CreateSecretRequest {
  // Namespace name.
  string namespace = 1 [(buf.validate.field).string = {min_len: 1, max_len: 64}];
  // Path relative to the namespace, e.g. "signing/api_key". Empty, "." and
  // ".." segments are rejected so paths stay canonical for scope globs.
  string path = 2 [
    (buf.validate.field).string.pattern = "^[a-z0-9][a-z0-9_./-]{0,255}$",
    (buf.validate.field).cel = {
      id: "secret_path.segments"
      message: "path must not contain empty, \".\" or \"..\" segments"
      expression: "!this.matches('(^|/)[.]{1,2}(/|$)') && !this.contains('//') && !this.endsWith('/')"
    }
  ];
  // Secret value (1 byte .. 64 KiB).
  string value = 3 [(buf.validate.field).string = {min_len: 1, max_bytes: 65536}];
  // Human-readable description.
  string description = 4 [(buf.validate.field).string.max_len = 1024];
  // Free-form tags.
  repeated string tags = 5 [(buf.validate.field).repeated = {max_items: 64, items: {string: {min_len: 1, max_len: 64}}}];
  // Expiry time; unset = never expires. Alerts fire 7 days before expiry.
  google.protobuf.Timestamp expires_at = 6;
}

// CreateSecretResponse carries the created secret.
message CreateSecretResponse {
  // The created secret.
  SecretInfo secret = 1;
}

// UpdateSecretRequest updates a secret. Unset fields are left unchanged.
message UpdateSecretRequest {
  option (buf.validate.message).cel = {
    id: "update_secret.expires_at_conflict"
    message: "expires_at and clear_expires_at are mutually exclusive"
    expression: "!(has(this.expires_at) && this.clear_expires_at)"
  };

  // Secret ID.
  string id = 1 [(buf.validate.field).string = {min_len: 1, max_len: 64}];
  // New value (1 byte .. 64 KiB); stored as a new version.
  optional string value = 2 [(buf.validate.field).string = {min_len: 1, max_bytes: 65536}];
  // New description.
  optional string description = 3 [(buf.validate.field).string.max_len = 1024];
  // New tags; applied only when set_tags is true.
  repeated string tags = 4 [(buf.validate.field).repeated = {max_items: 64, items: {string: {min_len: 1, max_len: 64}}}];
  // Replace tags with the tags field (allows clearing them).
  bool set_tags = 5;
  // New expiry time.
  google.protobuf.Timestamp expires_at = 6;
  // Remove the expiry time.
  bool clear_expires_at = 7;
}

// UpdateSecretResponse carries the updated secret.
message UpdateSecretResponse {
  // The updated secret.
  SecretInfo secret = 1;
}

// DeleteSecretRequest identifies the secret to delete.
message DeleteSecretRequest {
  // Secret ID.
  string id = 1 [(buf.validate.field).string = {min_len: 1, max_len: 64}];
}

// DeleteSecretResponse is empty.
message DeleteSecretResponse {}

// RevealSecretRequest selects the secret version to reveal.
message RevealSecretRequest {
  // Secret ID.
  string id = 1 [(buf.validate.field).string = {min_len: 1, max_len: 64}];
  // Version to reveal; 0 = current version.
  int32 version = 2 [(buf.validate.field).int32.gte = 0];
}

// RevealSecretResponse carries the plaintext value.
message RevealSecretResponse {
  // Plaintext value.
  string value = 1;
  // Version that was revealed.
  int32 version = 2;
}

// ListSecretVersionsRequest selects a page of versions of a secret.
message ListSecretVersionsRequest {
  // Secret ID.
  string id = 1 [(buf.validate.field).string = {min_len: 1, max_len: 64}];
  // Page size, 0 = default (50).
  int32 page_size = 2 [(buf.validate.field).int32 = {gte: 0, lte: 500}];
  // Opaque cursor from a previous response.
  string page_token = 3 [(buf.validate.field).string.max_len = 1024];
}

// ListSecretVersionsResponse is a page of versions, newest first.
message ListSecretVersionsResponse {
  // Versions of this page.
  repeated SecretVersion versions = 1;
  // Cursor of the next page; empty when this is the last page.
  string next_page_token = 2;
  // Total number of versions.
  int32 total = 3;
}

// ListSecretAccessLogsRequest selects a page of access logs of a secret.
message ListSecretAccessLogsRequest {
  // Secret ID.
  string id = 1 [(buf.validate.field).string = {min_len: 1, max_len: 64}];
  // Page size, 0 = default (50).
  int32 page_size = 2 [(buf.validate.field).int32 = {gte: 0, lte: 500}];
  // Opaque cursor from a previous response.
  string page_token = 3 [(buf.validate.field).string.max_len = 1024];
}

// ListSecretAccessLogsResponse is a page of access logs, newest first. The
// total is omitted because audit logs are partitioned and potentially large.
message ListSecretAccessLogsResponse {
  // Access logs of this page.
  repeated SecretAccessLog logs = 1;
  // Cursor of the next page; empty when this is the last page.
  string next_page_token = 2;
}

// KEKInfo describes one key-encryption key.
message KEKInfo {
  // KEK ID.
  string id = 1;
  // Whether new data keys are wrapped with this KEK.
  bool current = 2;
  // Whether the KEK is present in the server configuration; false means records
  // wrapped with it cannot be decrypted.
  bool configured = 3;
  // Number of records whose data key is wrapped with this KEK.
  int64 wrapped_records = 4;
}

// GetKEKStatusRequest is empty.
message GetKEKStatusRequest {}

// GetKEKStatusResponse reports KEK configuration and rewrap progress.
message GetKEKStatusResponse {
  // ID of the current KEK.
  string current_kek_id = 1;
  // Configured KEKs and KEKs still referenced by stored records.
  repeated KEKInfo keks = 2;
  // Whether a rewrap job is running.
  bool rewrap_running = 3;
  // Records re-wrapped by the running or last job.
  int64 rewrap_done = 4;
  // Records to re-wrap in the running or last job.
  int64 rewrap_total = 5;
  // Error of the last job; empty when it succeeded.
  string last_rewrap_error = 6;
  // Time the last job finished.
  google.protobuf.Timestamp last_rewrap_finished_at = 7;
}

// StartKEKRewrapRequest is empty.
message StartKEKRewrapRequest {}

// StartKEKRewrapResponse reports whether a job was started.
message StartKEKRewrapResponse {
  // False when a rewrap job is already running.
  bool started = 1;
}
